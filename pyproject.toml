[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict-agent"
version = "0.1.0"
description = "Lie detector for coding agents — scans git diffs and returns PASS / SUSPICIOUS / LIED."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Verdict Contributors" },
]
keywords = ["ai", "agents", "testing", "git", "verification", "lie-detector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]
polyglot = [
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.0",
]
all = ["verdict-agent[api]", "verdict-agent[dev]", "verdict-agent[polyglot]"]

[project.scripts]
verdict = "verdict.cli:main"

[project.urls]
Homepage = "https://github.com/aelin-codes/verdict"
Repository = "https://github.com/aelin-codes/verdict"
Issues = "https://github.com/aelin-codes/verdict/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["verdict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]
